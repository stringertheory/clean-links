[project]
name = "clean_links"
version = "0.2.0"
description = "Decide whether two links point at the same resource"
authors = [
  { name = "Mike Stringer", email = "mike.stringer.internet@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
  "w3lib>=2.4.1,<3.0.0",
  "httpx>=0.28.1,<0.29.0",
]

[project.urls]
Repository = "https://github.com/stringertheory/clean-links"
Documentation = "https://stringertheory.github.io/clean-links/"

[tool.poetry]
packages = [
  {include = "clean_links"}
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = "^7.0"
mypy = "^2.3"
pre-commit = "^4.0"
tox = "^4.23"
bump-my-version = "^1.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = {extras = ["imaging"], version = "^9.6"}
mkdocstrings = {extras = ["python"], version = "^1.0"}


[tool.bumpversion]
current_version = "0.2.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = true
commit = false
message = "Bump version: {current_version} → {new_version}"
commit_args = "--no-verify"

[[tool.bumpversion.files]]
filename = "clean_links/__init__.py"

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
files = ["clean_links"]
disallow_untyped_defs = "True"
disallow_any_unimported = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 80
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Ternary
    "SIM108",
]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["clean_links"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]
