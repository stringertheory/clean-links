site_name: Clean Links
repo_url: https://github.com/stringertheory/clean-links
site_url: https://stringertheory.github.io/clean-links
site_description: Tools for cleaning up links
site_author: Mike Stringer
edit_uri: edit/main/docs/
repo_name: stringertheory/clean-links
copyright: is maintained by <a href="https://github.com/stringertheory">Mike Stringer</a>.

nav:
  - Home: index.md
  - Modules: modules.md
  - Glossary: glossary.md
plugins:
  - search
  - social
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.append('../')
theme:
  name: material
  custom_dir: docs_extras/overrides
  features:
    - content.tooltips
    # - navigation.instant
    # - navigation.instant.progress
    # - navigation.tabs
    # - navigation.tabs.sticky
    # - navigation.sections
    # - navigation.expand
    # - navigation.path
    # - navigation.footer
  font:
    text: Archivo
    code: Chivo Mono

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stringertheory/clean-links
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/clean-links

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

watch:
  - docs_extras
  - clean_links
